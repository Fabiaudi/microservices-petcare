# ================================
# CONFIG GERAL
# ================================
spring.application.name=API-GATEWAY
server.port=9191
spring.jackson.mapper.accept-case-insensitive-enums=true

# ================================
# CONFIG EUREKA
# ================================
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
management.endpoints.web.exposure.include=*

# ================================
# ROTEAMENTO PARA O CADASTRO-SERVICE
# ================================
spring.cloud.gateway.routes[0].id=CADASTRO-PETS
spring.cloud.gateway.routes[0].uri=lb://CADASTRO-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/pets/**

spring.cloud.gateway.routes[1].id=CADASTRO-BREEDS
spring.cloud.gateway.routes[1].uri=lb://CADASTRO-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/breeds/**

spring.cloud.gateway.routes[2].id=CADASTRO-OWNERS
spring.cloud.gateway.routes[2].uri=lb://CADASTRO-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/owners/**

# ================================
# ROTEAMENTO PARA O AGENDAMENTO-SERVICE
# ================================
spring.cloud.gateway.routes[3].id=AGENDAMENTO-SERVICE
spring.cloud.gateway.routes[3].uri=lb://AGENDAMENTO-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/appointments/**

# ================================
# ROTEAMENTO PARA O NOTIFICACAO-SERVICE
# ================================
spring.cloud.gateway.routes[4].id=NOTIFICACAO-SERVICE
spring.cloud.gateway.routes[4].uri=lb://NOTIFICACAO-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/email/appointments/**

# ================================
# DISCOVERY
# ================================
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
